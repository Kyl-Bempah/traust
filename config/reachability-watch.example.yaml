# Template for $TRAUST_CONFIG_HOME/reachability-watch.yaml — copy there and
# edit. The harness never reads this example at run time.
#
# Reachability watch register: the dated review clock for revisit triggers
# that no machine feed can answer. /drift-watch (check_reachability_coverage,
# leg 2) reports `reachability-watch:review` stale once `reviewed` is older
# than review_cadence_days.
#
# Reviewing means: answer each `question`, update `last_answer` and
# `checked`, then bump `reviewed`. A trigger that has fired is not resolved
# by bumping the date; it routes to the decision named in `on_fire`.

reviewed: "2026-01-01"
review_cadence_days: 92

watch:
  - id: advisory-symbol-data
    question: >-
      Does your advisory feed publish vulnerable-symbol or call-graph data
      for the ecosystems you have no reachability engine for?
    why_it_matters: >-
      Reachability could then be resolved from the advisory side instead of
      by building a code property graph per repository.
    checked: "2026-01-01"
    last_answer: >-
      Not fired. Replace with what you found at this review.
    on_fire: >-
      Name the plan or decision this trigger reopens.
